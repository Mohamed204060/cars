      security:
        - sessionAuth: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: partId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OemNumberCreateRequest' }
      responses:
        '201':
          description: أُضيف رقم OEM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OemNumberResponse' }
        '404': { description: القطعة غير موجودة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'رقم OEM مكرَّر لنفس الشركة المصنِّعة (REQ-PCT-005، DuplicateOemNumberError)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/logout:
    post:
      operationId: authLogout
      summary: تسجيل خروج المستخدم وإلغاء الجلسة فورًا
      x-traceability:
        requirements: [REQ-SEC-005, REQ-AUD-005]
        decisions: []
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: تم تسجيل الخروج وإلغاء الجلسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: لا جلسة نشطة أصلاً
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/identities:
    get:
      operationId: listMyIdentities
      summary: عرض وسائل الهوية المرتبطة بحساب المستخدم الحالي
      x-traceability:
        requirements: [REQ-IAM-016]
        decisions: []
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: قائمة وسائل الهوية المرتبطة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityListResponse'
        '401':
          description: لا جلسة صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: addMyIdentity
      summary: ربط وسيلة هوية إضافية بالحساب الحالي
      x-traceability:
        requirements: [REQ-IAM-015, REQ-IAM-017]
        decisions: []
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAddRequest'
      responses:
        '201':
          description: تم ربط وسيلة الهوية بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAddResponse'
        '400':
          description: وسيلة هوية معطَّلة إداريًا (ProviderDisabledError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: لا جلسة صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: الوسيلة مرتبطة بالفعل بحساب (نفس المستخدم أو آخر) — DuplicateIdentityError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/identities/{identityId}:
    delete:
      operationId: removeMyIdentity
      summary: إزالة وسيلة هوية من الحساب الحالي
      x-traceability:
        requirements: [REQ-IAM-016, REQ-IAM-017]
        decisions: []
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: تمت إزالة وسيلة الهوية بنجاح
        '401':
          description: لا جلسة صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: وسيلة الهوية غير موجودة لهذا الحساب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: محاولة إزالة آخر وسيلة هوية متبقية — LastIdentityRemovalError (REQ-IAM-016)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/providers:
    get:
      operationId: listEnabledProviders
      summary: عرض وسائل الهوية المتاحة حاليًا للتسجيل/الدخول
      x-traceability:
        requirements: [REQ-IAM-013]
        decisions: []
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: قائمة الوسائل المفعَّلة إداريًا فقط (is_enabled=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'

  /auth/login:
    post:
      operationId: authLogin
      summary: تسجيل دخول المستخدم
      x-traceability:
        requirements: [REQ-IAM-003, REQ-SEC-004, REQ-SEC-007]
        decisions: []
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: نجاح تسجيل الدخول
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: >
            بيانات اعتماد غير صحيحة (error_code=INVALID_CREDENTIALS) — رسالة
            موحَّدة واحدة دائمًا لكل من: هوية غير موجودة، كلمة مرور خاطئة،
            حساب موقوف/محظور، أو مزوّد email_password معطَّل إداريًا؛ عمدًا
            بلا تمييز بينها لمنع تعداد الحسابات (تعديل CR-013 v2). تجاوز حد
            المحاولات المتكررة (REQ-SEC-007) لم يُنفَّذ بعد ضمن هذا الـIncrement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inventory-items:
    post:
      operationId: createInventoryItem
      summary: إنشاء عنصر مخزون بالإشارة لقطعة كتالوج معتمدة
      x-traceability:
        requirements: [REQ-STR-009, REQ-STR-012, REQ-STR-017, REQ-STR-020, REQ-STR-021]
        decisions: [ADR-011]
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemCreateRequest'
      responses:
        '201':
          description: تم إنشاء عنصر المخزون بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemCreateResponse'
        '400':
          description: قطعة كتالوج غير معتمدة، أو سياسة تسعير غير صالحة، أو حالة قطعة غير معروفة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: المتجر غير نشط، أو غير مملوك للمستخدم الحالي
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /purchase-requests/{requestId}/offers:
    post:
      operationId: submitOffer
      summary: تقديم عرض سعر بائع على طلب شراء قائم
      x-traceability:
        requirements: [REQ-PUR-011, REQ-PUR-016]
        decisions: [CR-002]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferSubmitRequest'
      responses:
        '201':
          description: تم تقديم العرض بنجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSubmitResponse'
        '409':
          description: طلب الشراء مغلق أو منتهي الصلاحية، أو يوجد عرض نشط سابق لنفس البائع
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: البائع غير مؤهَّل لهذا الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /search/parts:
    get:
      operationId: searchParts
      summary: البحث عن عناصر مخزون متوافقة مع معايير محددة
      description: >
        نقطة الوصول الوحيدة لخدمة البحث في كامل النظام؛ يُعاد استخدام العملية
        نفسها بلا أي تفريع عبر أربعة سياقات واجهة مستخدم مختلفة (تصميم إعادة
        استخدام، لا تغيير في المتطلبات أو منطق البحث): الصفحة الرئيسية (نموذج
        بحث كامل)، صفحة نتائج البحث (نفس النموذج مع الاحتفاظ بالفلاتر
        المختارة)، صفحة تفاصيل المنتج (نموذج مبسَّط أو "بحث مشابه" بتعبئة
        مسبقة من جهة العميل لمعاملات كـtrim_ref_id وcondition_ref_id)، وصفحة
        المتجر (نفس النموذج مع تمرير store_ref_id تلقائيًا). أي حقل مرجعي لم
        يحدِّده المستهلك يعني عدم تطبيق ذلك الفلتر (REQ-SRC-010) — لا تُرسَل
        قيمة "all" حرفية أبدًا.
      x-traceability:
        requirements: [REQ-SRC-001, REQ-SRC-003, REQ-SRC-004, REQ-SRC-006, REQ-SRC-006-C, REQ-SRC-006-D, REQ-SRC-006-E, REQ-SRC-007, REQ-SRC-007-A, REQ-SRC-010, REQ-SRC-011, REQ-SRC-013]
        decisions: [CR-004, CR-006]
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - name: q
          in: query
          schema: { type: string }
          description: نص البحث الحر
        - name: trim_ref_id
          in: query
          schema: { type: string, format: uuid }
          description: غيابه يعني عدم التصفية بفئة سيارة محددة (REQ-SRC-010)، لا قيمة "الكل" مرسَلة
        - name: price_filter
          in: query
          schema: { type: string, enum: [all, priced_only, unpriced_only] }
          description: يبقى تصنيفًا ثلاثيًا كما هو (REQ-SRC-004)؛ لم يتأثر بـCR-006
        - name: condition_ref_id
          in: query
          schema: { type: string, format: uuid }
          description: غيابه يعني عدم التصفية بحالة قطعة محددة (REQ-SRC-010)
        - name: verified_sellers_only
          in: query
          schema: { type: boolean }
        - name: country_ref_id
          in: query
          required: false
          description: >
            اختياري؛ عند غيابه يُحدَّد تلقائيًا من جهة الخادم وفق ترتيب
            الحساب ثم الموقع الجغرافي ثم IP (REQ-SRC-006-C)، أو دون تصفية
            جغرافية إن تعذَّر الاكتشاف (REQ-SRC-006-E).
          schema: { type: string, format: uuid }
        - name: city_ref_id
          in: query
          schema: { type: string, format: uuid }
        - name: store_ref_id
          in: query
          required: false
          description: >
            اختياري؛ يُستخدَم عند إعادة استخدام مكوّن البحث ضمن سياق صفحة
            متجر محدد، لتقييد النتائج على عناصر ذلك المتجر فقط.
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
        - name: sort
          in: query
          schema: { type: string }
          description: "بصيغة <حقل>:<asc|desc>؛ افتراضيًا وفق سياسة الترتيب المعتمدة؛ آخر قيمة يستخدمها العضو المسجَّل تُحفَظ وتُقتَرح تلقائيًا لاحقًا (REQ-SRC-013)"
      responses:
        '200':
          description: نتائج البحث
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: معيار تصفية غير صالح (قيمة مرجعية غير موجودة)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reference-data/{type}/bulk-import/preview:
    post:
      operationId: previewBulkImport
      summary: معاينة نتيجة استيراد جماعي لملف بيانات مرجعية قبل تأكيده
      x-traceability:
        requirements: [REQ-REF-004, REQ-REF-005, REQ-REF-006]
        decisions: [CR-003]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [country, city, language, fuel_type, transmission_type, engine_type, part_condition, subscription_type]
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ملف .xlsx فقط
      responses:
        '200':
          description: نتيجة المعاينة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportPreviewResponse'
        '403':
          description: صلاحية غير كافية (يتطلب مدير النظام أو مفوَّضًا مماثلاً)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: صيغة ملف غير مدعومة أو نوع بيانات مرجعية غير مدعوم بالاستيراد الجماعي
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

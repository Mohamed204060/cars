openapi: 3.0.3
info:
  title: منصة قطع غيار السيارات - Auto Parts Marketplace API
  version: "1.4.0"
  description: >
    مواصفة API تنفيذية، تغطي 15 عملية (Operations) عبر 14 مسارًا (Paths):
    الواجهات التمثيلية الخمس الأصلية الموثّقة بالتفصيل في التصميم التفصيلي
    (الحزمة 2)، بالإضافة إلى 5 عمليات خدمة Auth (اعتماد Contract Extension &
    Implementation Plan): تسجيل خروج، عرض/إضافة/إزالة وسائل الهوية، وعرض
    مزوّدي الهوية المفعَّلين — فتصبح عمليات Auth تحديدًا 6 عمليات شاملة
    /auth/login الأصلية. وبالإضافة أيضًا إلى 5 عمليات خدمة PCT (الكتالوج):
    اقتراح قطعة، عرضها، اعتمادها (مدير النظام فقط، REQ-PCT-002)، إضافة اسم
    مترجَم، وتسجيل رقم OEM. وبالإضافة إلى 7 عمليات خدمة VCT (كتالوج
    السيارات): اقتراح واعتماد شركة مصنّعة (مدير النظام فقط، REQ-VCT-002)،
    عرضها، اقتراح موديل تحت شركة معتمَدة (REQ-VCT-003)، إضافة جيل، إضافة
    فئة سيارة، وعرض فئة سيارة. وبالإضافة إلى 4 عمليات خدمة CMP (التوافق):
    إنشاء سجل توافق بين قطعة معتمَدة وفئة صالحة (مدير النظام فقط،
    REQ-CMP-001/002)، عرض سجل، عرض كل سجلات قطعة، وأرشفته (مدير النظام
    فقط، REQ-CMP-003). كل عملية موسومة بامتداد x-traceability
    يربطها بمعرّفات المتطلبات (REQ) وقرارات ADR/Change Request ذات الصلة.
  x-governance: >
    أي تغيير غير متوافق على أي عملية يستوجب إصدار نسخة عقد جديدة
    (/api/v{n}) بدلاً من تعديل هذه النسخة مباشرة (DD الحزمة 2، القسم 2.1).
    هذا الملف يُوسَّع تدريجيًا؛ لا يُحذَف أو يُعدَّل أي عملية قائمة دون
    Change Request رسمي وفق دليل حوكمة التنفيذ. عمليات التسجيل/الدخول عبر
    Google/Facebook/X (REQ-IAM-011) مؤجَّلة عمدًا إلى Increment لاحق ضمن
    مرحلة Auth، بانتظار ADR يحسم تدفق التحقق الآمن؛ لا عملية OAuth موثَّقة
    هنا حتى صدوره.

servers:
  - url: /api/v1
    description: الإصدار الأول من عقود API (URI Versioning، DD الحزمة 2)

security:
  - sessionAuth: []

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        جلسة مستخدم صادرة عن وحدة IAM بعد تسجيل دخول ناجح (REQ-IAM-003)،
        مدعومة بجدول iam.sessions (CR-013). تُسلَّم عبر Set-Cookie بخصائص
        HttpOnly (لا يقرأها JavaScript) وSecure (HTTPS فقط) وSameSite=Lax
        كحد أدنى. يُخزَّن على الخادم بصمة SHA-256 للتوكن فقط، لا التوكن
        الخام (اتساقًا مع REQ-SEC-002). غير مطلوبة لعمليات الوصول العام مثل
        تسجيل الدخول نفسه أو البحث أو عرض مزوّدي الهوية المفعَّلين.

  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        معرّف تتبع اختياري يرفقه المستهلك؛ إن غاب يُنشئ النظام معرّفًا جديدًا
        عند نقطة الدخول (SAD الحزمة 4، DD الحزمة 2 القسم 2.4).
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        مفتاح عدم تكرار للعمليات الحساسة المعرَّضة لإعادة الإرسال
        (DD الحزمة 2، القسم 2.2). مطلوب فعليًا (required) على مستوى العملية
        عند الإنشاء، لا على مستوى الوثيقة العام.
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      description: نموذج الخطأ الموحّد المعتمد لجميع واجهات API (DD الحزمة 2، القسم 2.1/2.2)
      required: [correlation_id, error_code, message]
      properties:
        correlation_id:
          type: string
          format: uuid
        error_code:
          type: string
          example: "PART_NOT_APPROVED"
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string

    PaginationMeta:
      type: object
      description: بيانات التقسيم الموحّدة (DD الحزمة 2، القسم 2.3)
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer

    LoginRequest:
      type: object
      required: [login_identifier, password]
      properties:
        login_identifier:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      description: >
        لا يتضمَّن التوكن الخام (session_id) في جسم الاستجابة عمدًا (تصحيح CR-013)؛
        يُسلَّم حصرًا عبر Set-Cookie بخصائص HttpOnly وSecure وSameSite، لمنع
        وصول أي كود JavaScript إليه ولو عبر قراءة جسم استجابة تسجيل الدخول نفسها.
      properties:
        primary_role:
          type: string
        account_status:
          type: string

    InventoryItemCreateRequest:
      type: object
      required: [catalog_part_ref_id, condition_ref_id, pricing_mode, quantity]
      properties:
        catalog_part_ref_id:
          type: string
          format: uuid
        condition_ref_id:
          type: string
          format: uuid
        pricing_mode:
          type: string
          enum: [fixed_price, contact_for_price]
        price_amount:
          type: number
          format: double
        price_currency:
          type: string
          minLength: 3
          maxLength: 3
        quantity:
          type: integer
          minimum: 0
        photo_asset_refs:
          type: array
          items:
            type: string

    InventoryItemCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_code:
          type: string
        status:
          type: string

    OfferSubmitRequest:
      type: object
      required: [amount, currency, provides_shipping]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          minLength: 3
          maxLength: 3
        provides_shipping:
          type: boolean
        notes:
          type: string

    OfferSubmitResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_code:
          type: string
        status:
          type: string
          enum: [submitted]

    SearchResultItem:
      type: object
      properties:
        inventory_item_id:
          type: string
          format: uuid
        business_code:
          type: string
        part_name:
          type: string
        store_name:
          type: string
        image_url:
          type: string
        price_amount:
          type: number
          nullable: true
        price_display_text:
          type: string
          description: نص بديل عند غياب السعر (REQ-STR-014)

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        effective_country_code:
          type: string
          description: الدولة الفعّالة المستخدَمة في التصفية (REQ-SRC-006-C)
        effective_country_source:
          type: string
          enum: [account, geolocation, ip, manual]
          description: مصدر الدولة الفعّالة (مقترح توضيحي معتمَد، DD الحزمة 2 v1.4)
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    BulkImportPreviewResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        new_count:
          type: integer
        updated_count:
          type: integer
        rejected_count:
          type: integer
        rejected_rows:
          type: array
          items:
            type: object
            properties:
              row_number:
                type: integer
              reason:
                type: string

    LogoutResponse:
      type: object
      description: تأكيد إلغاء الجلسة فورًا (REQ-SEC-005)
      properties:
        status:
          type: string
          enum: [logged_out]

    IdentitySummary:
      type: object
      description: وصف مختصر لوسيلة هوية مرتبطة بحساب (REQ-IAM-016)
      properties:
        id:
          type: string
          format: uuid
        provider_code:
          type: string
        is_verified:
          type: boolean
        is_primary:
          type: boolean
        last_authenticated_at:
          type: string
          format: date-time
          nullable: true

    IdentityListResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/IdentitySummary'

    IdentityAddRequest:
      type: object
      description: ربط وسيلة هوية إضافية بحساب المستخدم الحالي (REQ-IAM-015)
      required: [provider_code, external_identifier]
      properties:
        provider_code:
          type: string
          example: "email_password"
        external_identifier:
          type: string
        is_verified:
          type: boolean
          default: false

    IdentityAddResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_code:
          type: string
        is_verified:
          type: boolean

    ProviderSummary:
      type: object
      description: وسيلة هوية متاحة حاليًا للتسجيل/الدخول (REQ-IAM-013)
      properties:
        code:
          type: string
        display_name:
          type: string
        category:
          type: string
          enum: [password, otp, oauth]

    ProviderListResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderSummary'

    CatalogPartCreateRequest:
      type: object
      required: [category_id]
      properties:
        category_id:
          type: string
          format: uuid

    CatalogPartResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        status: { type: string, enum: [proposed, approved, archived] }

    LocalizedNameCreateRequest:
      type: object
      required: [name_value, name_kind]
      properties:
        name_value: { type: string }
        name_kind: { type: string, enum: [canonical, local, english, synonym] }
        locale: { type: string, nullable: true }

    LocalizedNameResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name_value: { type: string }
        name_kind: { type: string }
        locale: { type: string, nullable: true }

    OemNumberCreateRequest:
      type: object
      required: [manufacturer_ref_id, oem_number]
      properties:
        manufacturer_ref_id: { type: string, format: uuid }
        oem_number: { type: string }

    OemNumberResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        manufacturer_ref_id: { type: string, format: uuid }
        oem_number: { type: string }

    ManufacturerResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [proposed, approved, archived] }

    ModelResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        manufacturer_id: { type: string, format: uuid }
        status: { type: string, enum: [proposed, approved, archived] }

    GenerationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        model_id: { type: string, format: uuid }

    TrimCreateRequest:
      type: object
      required: [fuel_type_ref_id, transmission_type_ref_id]
      properties:
        fuel_type_ref_id: { type: string, format: uuid }
        transmission_type_ref_id: { type: string, format: uuid }

    TrimResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        generation_id: { type: string, format: uuid }
        fuel_type_ref_id: { type: string, format: uuid }
        transmission_type_ref_id: { type: string, format: uuid }

    CompatibilityRecordCreateRequest:
      type: object
      required: [catalog_part_ref_id, trim_ref_id]
      properties:
        catalog_part_ref_id: { type: string, format: uuid }
        trim_ref_id: { type: string, format: uuid }

    CompatibilityRecordResponse:
      type: object
      description: >
        يقتصر على الحقول المخزَّنة فعليًا في 007_cmp.sql. حقول
        fitment_type/compatibility_notes/source المذكورة في كود الخدمة كخطة
        مستقبلية (Backlog) لا تقابلها أعمدة في قاعدة البيانات بعد، وتستوجب
        Migration وقرارًا حوكميًا منفصلَين قبل إضافتها لهذا العقد.
      properties:
        id: { type: string, format: uuid }
        catalog_part_ref_id: { type: string, format: uuid }
        trim_ref_id: { type: string, format: uuid }
        status: { type: string, enum: [active, archived] }

paths:
  /cmp/records:
    post:
      operationId: createCompatibilityRecord
      summary: إنشاء سجل توافق بين قطعة كتالوج معتمَدة وفئة سيارة صالحة (مدير النظام فقط)
      x-traceability: { requirements: [REQ-CMP-001, REQ-CMP-002], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CorrelationIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompatibilityRecordCreateRequest' }
      responses:
        '201': { description: أُنشئ السجل بحالة active, content: { application/json: { schema: { $ref: '#/components/schemas/CompatibilityRecordResponse' } } } }
        '401': { description: لا جلسة صالحة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'ليس مدير نظام (REQ-CMP-001)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'قطعة غير معتمَدة، أو فئة سيارة غير صالحة، أو زوج مكرَّر (REQ-CMP-002)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /cmp/records/{recordId}:
    get:
      operationId: getCompatibilityRecord
      summary: عرض سجل توافق بمعرّفه
      x-traceability: { requirements: [REQ-CMP-001], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: بيانات السجل, content: { application/json: { schema: { $ref: '#/components/schemas/CompatibilityRecordResponse' } } } }
        '404': { description: غير موجود, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /cmp/parts/{partId}/records:
    get:
      operationId: listCompatibilityRecordsForPart
      summary: عرض كل سجلات التوافق لقطعة كتالوج معيّنة
      x-traceability: { requirements: [REQ-CMP-001], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: partId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: قائمة سجلات التوافق (قد تكون فارغة)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CompatibilityRecordResponse' } }

  /cmp/records/{recordId}/archive:
    post:
      operationId: archiveCompatibilityRecord
      summary: أرشفة سجل توافق يدويًا (مدير النظام فقط)
      x-traceability: { requirements: [REQ-CMP-003], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: أصبح السجل مؤرشَفًا, content: { application/json: { schema: { $ref: '#/components/schemas/CompatibilityRecordResponse' } } } }
        '403': { description: 'ليس مدير نظام (REQ-CMP-003)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: غير موجود, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: انتقال حالة غير مسموح (مؤرشَف بالفعل), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /vct/manufacturers:
    post:
      operationId: proposeManufacturer
      summary: اقتراح شركة مصنّعة جديدة
      x-traceability: { requirements: [REQ-VCT-001], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CorrelationIdHeader' }]
      responses:
        '201': { description: أُنشئت بحالة proposed, content: { application/json: { schema: { $ref: '#/components/schemas/ManufacturerResponse' } } } }
        '401': { description: لا جلسة صالحة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /vct/manufacturers/{manufacturerId}:
    get:
      operationId: getManufacturer
      summary: عرض شركة مصنّعة بمعرّفها
      x-traceability: { requirements: [REQ-VCT-001, REQ-VCT-002], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: manufacturerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: بيانات الشركة, content: { application/json: { schema: { $ref: '#/components/schemas/ManufacturerResponse' } } } }
        '404': { description: غير موجودة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /vct/manufacturers/{manufacturerId}/approve:
    post:
      operationId: approveManufacturer
      summary: اعتماد شركة مصنّعة (مدير النظام فقط)
      x-traceability: { requirements: [REQ-VCT-002], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: manufacturerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: أصبحت معتمَدة, content: { application/json: { schema: { $ref: '#/components/schemas/ManufacturerResponse' } } } }
        '401': { description: لا جلسة صالحة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'ليس مدير نظام (super_admin/admin فقط)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: غير موجودة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: انتقال حالة غير مسموح, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /vct/manufacturers/{manufacturerId}/models:
    post:
      operationId: proposeModel
      summary: اقتراح موديل تحت شركة مصنّعة معتمَدة
      x-traceability: { requirements: [REQ-VCT-003], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: manufacturerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: أُنشئ الموديل, content: { application/json: { schema: { $ref: '#/components/schemas/ModelResponse' } } } }
        '404': { description: الشركة المصنّعة غير موجودة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'الشركة المصنّعة غير معتمَدة بعد (REQ-VCT-003)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /vct/models/{modelId}/generations:
    post:
      operationId: createGeneration
      summary: إضافة جيل تحت موديل
      x-traceability: { requirements: [REQ-VCT-004], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: modelId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: أُنشئ الجيل, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationResponse' } } } }
        '404': { description: الموديل غير موجود, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /vct/generations/{generationId}/trims:
    post:
      operationId: createTrim
      summary: إضافة فئة سيارة تحت جيل (نوع الوقود وناقل الحركة)
      x-traceability: { requirements: [REQ-VCT-005], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: generationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrimCreateRequest' }
      responses:
        '201': { description: أُنشئت الفئة, content: { application/json: { schema: { $ref: '#/components/schemas/TrimResponse' } } } }
        '404': { description: الجيل غير موجود, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /vct/trims/{trimId}:
    get:
      operationId: getTrim
      summary: عرض فئة سيارة بمعرّفها (نقطة التحقق التي تستهلكها CMP)
      x-traceability: { requirements: [REQ-VCT-005], decisions: [] }
      security: [{ sessionAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: trimId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: بيانات الفئة, content: { application/json: { schema: { $ref: '#/components/schemas/TrimResponse' } } } }
        '404': { description: غير موجودة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /pct/parts:
    post:
      operationId: proposeCatalogPart
      summary: تقديم طلب إضافة قطعة جديدة للكتالوج
      x-traceability:
        requirements: [REQ-PCT-001, REQ-PCT-007]
        decisions: []
      security:
        - sessionAuth: []
      parameters: [{ $ref: '#/components/parameters/CorrelationIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogPartCreateRequest' }
      responses:
        '201':
          description: أُنشئت القطعة بحالة proposed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPartResponse' }
        '401': { description: لا جلسة صالحة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: category_id غير موجود (FK), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /pct/parts/{partId}:
    get:
      operationId: getCatalogPart
      summary: عرض تفاصيل قطعة كتالوج بمعرّفها
      x-traceability:
        requirements: [REQ-PCT-001, REQ-PCT-002]
        decisions: []
      security:
        - sessionAuth: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: partId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: بيانات القطعة
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPartResponse' }
        '404': { description: غير موجودة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /pct/parts/{partId}/approve:
    post:
      operationId: approveCatalogPart
      summary: اعتماد قطعة كتالوج (proposed → approved)
      x-traceability:
        requirements: [REQ-PCT-002]
        decisions: ["يستوجب تحديد آلية تفويض دور مدير النظام قبل التنفيذ — انظر ملاحظة الصلاحيات"]
      security:
        - sessionAuth: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: partId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: أصبحت القطعة معتمَدة
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPartResponse' }
        '401': { description: لا جلسة صالحة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: لا صلاحية اعتماد (مدير نظام فقط، REQ-PCT-002), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: غير موجودة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: انتقال حالة غير مسموح (InvalidCatalogPartStatusError), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /pct/parts/{partId}/names:
    post:
      operationId: addCatalogPartLocalizedName
      summary: إضافة اسم (قياسي/محلي/إنجليزي/مرادف) لقطعة كتالوج
      x-traceability:
        requirements: [REQ-PCT-003]
        decisions: []
      security:
        - sessionAuth: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationIdHeader' }
        - { name: partId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalizedNameCreateRequest' }
      responses:
        '201':
          description: أُضيف الاسم
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalizedNameResponse' }
        '400': { description: قيمة اسم فارغة أو نوع اسم غير معروف, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: القطعة غير موجودة, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /pct/parts/{partId}/oem-numbers:
    post:

name: PostgreSQL Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "postgres_execution_package/**"
      - ".github/workflows/postgresql-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "postgres_execution_package/**"
      - ".github/workflows/postgresql-validation.yml"

permissions:
  contents: read

concurrency:
  group: postgresql-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-postgresql:
    name: PostgreSQL 16 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_NAME: carparts_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carparts_test
      PYTHONUNBUFFERED: "1"
      PACKAGE_DIR: postgres_execution_package
      EVIDENCE_DIR: execution-evidence

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: postgres_execution_package/requirements.txt

      - name: Prepare evidence directory
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Record environment and versions
        run: |
          set -o pipefail
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            python --version
            pip --version
            psql --version
          } 2>&1 | tee "$EVIDENCE_DIR/environment.txt"

      - name: Wait for PostgreSQL readiness
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for PostgreSQL ($attempt/60)..."
            sleep 2
          done
          echo "PostgreSQL did not become ready in time." >&2
          exit 1

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$PACKAGE_DIR/requirements.txt" 2>&1 | tee "$EVIDENCE_DIR/dependency-install.log"
          python -m pip freeze | tee "$EVIDENCE_DIR/python-packages.txt"

      - name: Verify execution package structure
        run: |
          set -euo pipefail
          required_files=(
            "$PACKAGE_DIR/README.md"
            "$PACKAGE_DIR/requirements.txt"
            "$PACKAGE_DIR/scripts/setup_test_database.sh"
            "$PACKAGE_DIR/scripts/teardown_test_database.sh"
            "$PACKAGE_DIR/tools/schema_drift_check.py"
            "$PACKAGE_DIR/tests/conftest.py"
            "$PACKAGE_DIR/tests/test_postgres_repositories.py"
            "$PACKAGE_DIR/tests/test_postgres_integration.py"
          )
          missing_files=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then echo "FOUND: $file"; else echo "MISSING: $file" >&2; missing_files=$((missing_files+1)); fi
          done
          migration_count="$(find "$PACKAGE_DIR/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          {
            echo "migration_count=$migration_count"
            echo "missing_files=$missing_files"
          } | tee "$EVIDENCE_DIR/package-verification.txt"
          test "$missing_files" -eq 0
          test "$migration_count" -eq 23
          echo "Execution package structure is valid."

      - name: Create database and apply 23 migrations
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/setup_test_database.sh 2>&1 | tee "../$EVIDENCE_DIR/migrations.log"

      - name: Capture schema inventory
        run: |
          set -euo pipefail
          psql -d "$DB_NAME" -v ON_ERROR_STOP=1 -c "\dn+" > "$EVIDENCE_DIR/schema-list.txt" 2>&1
          psql -d "$DB_NAME" -v ON_ERROR_STOP=1 -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') ORDER BY schemaname, tablename;" > "$EVIDENCE_DIR/table-list.txt" 2>&1
          pg_dump --schema-only --no-owner --no-privileges "$DB_NAME" > "$EVIDENCE_DIR/schema.sql"

      - name: Run schema drift check
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python tools/schema_drift_check.py 2>&1 | tee "../$EVIDENCE_DIR/schema-drift.json"

      - name: Run repository tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_repositories.py -vv \
            --junitxml="../$EVIDENCE_DIR/repository-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/repository-tests.log"

      - name: Run integration tests
        working-directory: postgres_execution_package
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_integration.py -vv \
            --junitxml="../$EVIDENCE_DIR/integration-tests.xml" \
            2>&1 | tee "../$EVIDENCE_DIR/integration-tests.log"


      - name: Run full regression (361 tests)
        run: |
          set -euo pipefail
          SRC_PATHS="$(find full_regression/services -mindepth 2 -maxdepth 2 -type d -name src | sort | paste -sd: -)"
          TEST_PATHS="$(find full_regression/services -mindepth 2 -maxdepth 2 -type d -name tests | sort | tr '\n' ' ')"
          PYTHONPATH="$SRC_PATHS" python -m pytest $TEST_PATHS -vv \
            --junitxml="$EVIDENCE_DIR/full-regression.xml" \
            2>&1 | tee "$EVIDENCE_DIR/full-regression.log"

      - name: Generate execution summary
        if: always()
        run: |
          {
            echo "# PostgreSQL Validation Evidence"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Commit: $GITHUB_SHA"
            echo "- PostgreSQL: 16"
            echo "- Python: 3.12"
            echo "- Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Job status: ${{ job.status }}"
          } | tee "$EVIDENCE_DIR/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"


      - name: Capture PostgreSQL diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR"
          echo "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container-id.txt"
          docker inspect "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container-inspect.json" 2>&1 || true
          docker logs "${{ job.services.postgres.id }}" > "$EVIDENCE_DIR/postgres-container.log" 2>&1 || true
          docker ps -a > "$EVIDENCE_DIR/docker-ps.txt" 2>&1 || true

      - name: Teardown test database
        if: always()
        working-directory: postgres_execution_package
        run: |
          chmod +x scripts/teardown_test_database.sh
          ./scripts/teardown_test_database.sh 2>&1 | tee "../$EVIDENCE_DIR/teardown.log" || true

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: postgresql-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: execution-evidence/
          if-no-files-found: error
          retention-days: 30
